name: CI

# Runs on every push and pull request. Same steps you can run locally with: npm run check
on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Covers the rules engine (perft for standard chess and Chess960, variants, PGN), the AI,
      # the content selectors, and the shipped content (cinematics, memes, piece sets, sprites).
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: chass-dist
          path: dist
          retention-days: 7
